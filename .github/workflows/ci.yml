name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    # Linux runs the platform-independent core (layout, detector, engine, config);
    # Windows builds and lints everything, including the hooks and the settings window.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  quality:
    # Detector and spelling accuracy against the limits in examples/regress.rs.
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --locked --example regress

  installer:
    # Compiles the installer script on every change, so a broken script shows up before a release.
    needs: [fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0 /O"dist" installer\openswitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, test, quality, installer]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/openswitch.exe dist/openswitch.exe
          Compress-Archive -Path target/release/openswitch.exe, LICENSE, README.md -DestinationPath "dist/OpenSwitch-$v-windows-x64.zip"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($v.TrimStart('v'))" /O"dist" installer\openswitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem dist -File
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Package manager manifests
        shell: pwsh
        run: |
          python tools/gen_manifests.py "${{ github.ref_name }}" dist manifests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path manifests/winget -DestinationPath dist/winget-manifests.zip
          Copy-Item manifests/openswitch.json dist/openswitch.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/openswitch.exe
            dist/*.zip
            dist/*-setup.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "OpenSwitch $GITHUB_REF_NAME" --generate-notes
